const un=b=>Uint8Array.from(atob(b),c=>c.charCodeAt(0));
async function unlock(pw){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:un(BLOB.s),iterations:BLOB.n,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:un(BLOB.i)},key,un(BLOB.c));
  return JSON.parse(new TextDecoder().decode(plain));
}
async function open_(pw,quiet){
  const msg=document.getElementById('msg'); msg.textContent=quiet?'':'Opening\u2026';
  try{
    const p=await unlock(pw);
    if(document.getElementById('keep').checked){ try{ localStorage.setItem('desk.pw',pw); }catch(e){} }
    document.getElementById('gate').hidden=true;
    const app=document.getElementById('app'); app.innerHTML=p.html; app.hidden=false;
    (new Function(p.js))();
  }catch(e){ if(!quiet) msg.textContent='That password did not open it. Check with Sofi.'; try{ localStorage.removeItem('desk.pw'); }catch(_){} }
}
document.getElementById('gate').addEventListener('submit',e=>{ e.preventDefault(); open_(document.getElementById('pw').value,false); });
let saved=null; try{ saved=localStorage.getItem('desk.pw'); }catch(e){}
if(saved) open_(saved,true);
